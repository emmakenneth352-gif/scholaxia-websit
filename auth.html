<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholaxia — Sign in</title>
    <link rel="icon" type="image/png" href="media/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-body">
    <a class="auth-back" href="index.html">← Back to home</a>

    <main class="auth-shell">
      <section class="auth-card">
        <div class="auth-brand">
          <img src="media/logo.png" alt="" />
          <div>
            <strong>Scholaxia</strong>
            <span id="portalSub">Sign in to your account</span>
          </div>
        </div>

        <div class="role-row" role="tablist" aria-label="Account type">
          <button type="button" class="role-btn is-active" data-role="student" role="tab" aria-selected="true">
            Student
          </button>
          <button type="button" class="role-btn" data-role="teacher" role="tab" aria-selected="false">
            Teacher
          </button>
          <button type="button" class="role-btn" data-role="kind" role="tab" aria-selected="false">
            Kid
          </button>
        </div>

        <div class="mode-tabs" role="tablist" aria-label="Auth mode">
          <button type="button" class="mode-tab is-active" id="tabLogin" role="tab" aria-selected="true" aria-controls="formLogin">
            Log in
          </button>
          <button type="button" class="mode-tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="formSignup">
            Sign up
          </button>
        </div>

        <div class="auth-panels">
          <form id="formLogin" class="auth-form" role="tabpanel" aria-labelledby="tabLogin">
            <label>
              Email
              <input id="loginEmail" type="email" autocomplete="email" required placeholder="you@email.com" />
            </label>
            <label>
              Password
              <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••" />
            </label>
            <p class="auth-error" id="loginError" hidden></p>
            <button class="auth-submit" type="submit" id="btnLogin">Log in</button>
            <p class="auth-switch" id="loginSwitch">
              New here?
              <button type="button" id="gotoSignup">Create an account</button>
            </p>
          </form>

          <form id="formSignup" class="auth-form is-off" role="tabpanel" aria-labelledby="tabSignup" hidden>
            <div id="signupStepDetails" class="auth-step">
              <label>
                Full name
                <input id="signupName" type="text" autocomplete="name" required placeholder="Your full name" />
              </label>
              <label>
                Email
                <input id="signupEmail" type="email" autocomplete="email" required placeholder="you@email.com" />
              </label>
              <label>
                Password
                <input
                  id="signupPassword"
                  type="password"
                  autocomplete="new-password"
                  required
                  minlength="6"
                  placeholder="At least 6 characters"
                />
              </label>
              <div id="kindFields" hidden>
                <label>
                  Age group
                  <select id="signupAge">
                    <option value="3-5">Ages 3–5</option>
                    <option value="6-8" selected>Ages 6–8</option>
                    <option value="9-12">Ages 9–12</option>
                  </select>
                </label>
                <label>
                  Parent email (optional)
                  <input id="signupParent" type="email" placeholder="parent@email.com" />
                </label>
              </div>
              <p class="auth-hint" id="teacherHint" hidden>
                Teachers are added by school admin. Please use Log in.
              </p>
              <p class="auth-error" id="signupError" hidden></p>
              <button class="auth-submit" type="submit" id="btnSignup">Create account</button>
              <p class="auth-switch">
                Already have an account?
                <button type="button" id="gotoLogin">Log in</button>
              </p>
            </div>

            <div id="signupStepOtp" class="auth-step is-off" hidden>
              <p class="auth-hint">Enter the OTP sent to your email to finish signup.</p>
              <label>
                OTP code
                <input id="signupOtp" type="text" inputmode="numeric" maxlength="8" placeholder="6-digit code" />
              </label>
              <p class="auth-error" id="otpError" hidden></p>
              <button class="auth-submit" type="button" id="btnVerify">Verify &amp; continue</button>
              <button class="auth-linkish" type="button" id="btnBackDetails">← Back</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth-page.js"></script>
  </body>
</html>
