<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- NECO-style seal: blue ring with torch and book -->
  <circle cx="60" cy="52" r="40" fill="#1d4e89"/>
  <circle cx="60" cy="52" r="34" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="60" cy="52" r="29" fill="none" stroke="#f2c94c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- torch -->
  <path d="M60 32 l2.4 5.6 5.6 2.4 -5.6 2.4 -2.4 5.6 -2.4 -5.6 -5.6 -2.4 5.6 -2.4 Z" fill="#f2c94c"/>
  <!-- book -->
  <path d="M44 56 Q52 50 60 55 Q68 50 76 56 L76 68 Q68 62 60 67 Q52 62 44 68 Z" fill="#ffffff"/>
  <line x1="60" y1="55" x2="60" y2="67" stroke="#1d4e89" stroke-width="1.6"/>
  <text x="60" y="108" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#1d4e89" text-anchor="middle" letter-spacing="2">NECO</text>
</svg>
